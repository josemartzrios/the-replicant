# ===========================================
# The Replicant - Application Configuration
# ===========================================

server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-binding-errors: never

spring:
  application:
    name: the-replicant-api

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:replicant_db}
    username: ${POSTGRES_USER:replicant}
    password: ${POSTGRES_PASSWORD:replicant123}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

# Actuator — safe defaults, detail requires auth
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
      show-components: when-authorized

# OpenAPI / Swagger
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:dGhlLXJlcGxpY2FudC1kZXYtc2VjcmV0LWtleS0yMDI2LWNoYW5nZS1pbi1wcm9kdWN0aW9uLTEyMzQ1Njc4OTA=}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

# Cookie security — set COOKIE_SECURE=true in production
cookie:
  secure: ${COOKIE_SECURE:false}

# CORS Configuration
cors:
  allowed-origins: ${CORS_ORIGINS:http://localhost:3000}

# Logging
logging:
  level:
    root: INFO
    com.thereplicant: DEBUG

---
# ===========================================
# Dev Profile — relaxed settings for local development
# Activate with: SPRING_PROFILES_ACTIVE=dev
# ===========================================
spring:
  config:
    activate:
      on-profile: dev

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

server:
  error:
    include-message: always
    include-binding-errors: always

management:
  endpoint:
    health:
      show-details: always
      show-components: always

---
# ===========================================
# Test Profile (H2 In-Memory)
# ===========================================
spring:
  config:
    activate:
      on-profile: test

  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

---
# ===========================================
# Production Profile (Railway + Supabase)
# Activate with: SPRING_PROFILES_ACTIVE=prod
# ===========================================
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: ${DATABASE_URL}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

# Cookie security — force secure=true in production
cookie:
  secure: true

# Disable API documentation in production
springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false

# Actuator — health only, no details
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never

logging:
  level:
    root: WARN
    com.thereplicant: INFO
