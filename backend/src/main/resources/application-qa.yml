server:
  port: ${PORT:8080}

spring:
  datasource:
    url: ${DATABASE_URL}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: 86400000

cors:
  allowed-origins: https://test-replicant.vercel.app

logging:
  level:
    root: INFO
    com.thereplicant: INFO
