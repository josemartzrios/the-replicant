version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: thereplicant-db
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-replicant}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-replicant123}
      POSTGRES_DB: ${POSTGRES_DB:-replicant_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-replicant} -d ${POSTGRES_DB:-replicant_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
